version: '3.8'

# Production overrides: strict restarts, resource limits, production nginx
services:
  gateway:
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

  auth-service:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  ai-orchestrator:
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  celery-worker:
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
