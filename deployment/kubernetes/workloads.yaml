apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: bhooraksha
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: bhooraksha/auth-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: bhooraksha-config
            - secretRef:
                name: bhooraksha-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: bhooraksha
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-orchestrator
  namespace: bhooraksha
  labels:
    app: ai-agent-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-agent-orchestrator
  template:
    metadata:
      labels:
        app: ai-agent-orchestrator
    spec:
      containers:
        - name: ai-agent-orchestrator
          image: bhooraksha/ai-agent-orchestrator:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: bhooraksha-config
            - secretRef:
                name: bhooraksha-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-orchestrator
  namespace: bhooraksha
spec:
  selector:
    app: ai-agent-orchestrator
  ports:
    - port: 8001
      targetPort: 8001
---
