replicaCount: 2

image:
  repository: bhooraksha
  pullPolicy: IfNotPresent
  tag: "1.0.0"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: bhooraksha.gov.in
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: bhooraksha-tls
      hosts:
        - bhooraksha.gov.in

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

env:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
