apiVersion: v1
kind: Service
metadata:
  name: {{ include "bhooraksha.fullname" . }}-core
  labels:
    app.kubernetes.io/name: {{ include "bhooraksha.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "bhooraksha.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
