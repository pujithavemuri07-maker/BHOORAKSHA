upstream auth_service {
    server auth-service:8000;
}

upstream ai_orchestrator {
    server ai-orchestrator:8001;
}

upstream landing_page {
    server landing-page:8080;
}

upstream citizen_service {
    server citizen-service:3000;
}

upstream deo_service {
    server deo-service:3001;
}

upstream verifier_service {
    server verifier-service:3002;
}

upstream legal_service {
    server legal-service:3003;
}

upstream gis_service {
    server gis-service:3004;
}

upstream revenue_service {
    server revenue-admin-service:3005;
}

upstream admin_service {
    server system-admin-service:3006;
}

server {
    listen 80;
    server_name localhost;

    # Global proxy settings
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Auth Service
    location /api/v1/auth/ {
        proxy_pass http://auth_service/api/v1/auth/;
    }

    # AI Orchestrator Service
    location /api/v1/ai/ {
        proxy_pass http://ai_orchestrator/api/v1/;
    }

    location /api/v1/documents/ {
        proxy_pass http://ai_orchestrator/api/v1/documents/;
    }

    location /api/v1/verification/ {
        proxy_pass http://ai_orchestrator/api/v1/verification/;
    }

    # Citizen Portal
    location /citizen/ {
        proxy_pass http://citizen_service/;
    }

    # DEO Portal (Patwari)
    location /deo/ {
        proxy_pass http://deo_service/;
    }

    # Verifier Portal (Girdawar / Naib-Tehsildar)
    location /verifier/ {
        proxy_pass http://verifier_service/;
    }

    # Legal Portal
    location /legal/ {
        proxy_pass http://legal_service/;
    }

    # GIS Portal
    location /gis/ {
        proxy_pass http://gis_service/;
    }

    # Revenue Admin Portal (Tehsildar)
    location /revenue/ {
        proxy_pass http://revenue_service/;
    }

    # System Admin Portal
    location /admin/ {
        proxy_pass http://admin_service/;
    }

    # Public Landing Page (Default)
    location / {
        proxy_pass http://landing_page/;
    }

    # Health Check endpoint
    location /health {
        return 200 '{"status":"healthy","service":"bhooraksha-gateway"}\n';
        add_header Content-Type application/json;
    }
}
