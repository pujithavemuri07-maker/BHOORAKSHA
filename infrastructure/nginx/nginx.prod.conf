upstream auth_service {
    server auth-service:8000;
    keepalive 32;
}

upstream ai_orchestrator {
    server ai-orchestrator:8001;
    keepalive 32;
}

upstream landing_page {
    server landing-page:8080;
    keepalive 32;
}

upstream citizen_service {
    server citizen-service:3000;
    keepalive 32;
}

upstream deo_service {
    server deo-service:3001;
    keepalive 32;
}

upstream verifier_service {
    server verifier-service:3002;
    keepalive 32;
}

upstream legal_service {
    server legal-service:3003;
    keepalive 32;
}

upstream gis_service {
    server gis-service:3004;
    keepalive 32;
}

upstream revenue_service {
    server revenue-admin-service:3005;
    keepalive 32;
}

upstream admin_service {
    server system-admin-service:3006;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=15r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/ssl/certs/bhooraksha.crt;
    ssl_certificate_key /etc/ssl/private/bhooraksha.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://auth_service/api/v1/auth/;
    }

    location /api/v1/ai/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://ai_orchestrator/api/v1/;
    }

    location /citizen/ {
        proxy_pass http://citizen_service/;
    }

    location /deo/ {
        proxy_pass http://deo_service/;
    }

    location /verifier/ {
        proxy_pass http://verifier_service/;
    }

    location /legal/ {
        proxy_pass http://legal_service/;
    }

    location /gis/ {
        proxy_pass http://gis_service/;
    }

    location /revenue/ {
        proxy_pass http://revenue_service/;
    }

    location /admin/ {
        proxy_pass http://admin_service/;
    }

    location / {
        proxy_pass http://landing_page/;
    }

    location /health {
        access_log off;
        return 200 '{"status":"healthy","environment":"production"}\n';
        add_header Content-Type application/json;
    }
}
