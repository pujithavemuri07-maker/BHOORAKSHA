groups:
  - name: bhooraksha_alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Bhooraksha service {{ $labels.instance }} is down"
          description: "Service {{ $labels.instance }} of job {{ $labels.job }} has been unresponsive for more than 1 minute."

      - alert: HighRequestLatency
        expr: http_request_duration_seconds{quantile="0.95"} > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency detected"
          description: "P95 request latency exceeds 500ms on {{ $labels.instance }}."
